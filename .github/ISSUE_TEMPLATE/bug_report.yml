name: Bug report
description: Report a bug in lane-lock
title: '[bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please run `lane-lock doctor` and paste the output below.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 / macOS 14 / Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: e.g. v20.11.0 (from `node --version`)
    validations:
      required: true
  - type: input
    id: claude_code_version
    attributes:
      label: Claude Code CLI version
      placeholder: e.g. v2.1.97 (from `claude --version`)
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: Output of `lane-lock doctor`
      render: shell
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe what you expected and what actually happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. ... 2. ... 3. ...
