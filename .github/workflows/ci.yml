name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Smoke test install script (POSIX)
        if: runner.os != 'Windows'
        run: node bin/install.mjs --target "${RUNNER_TEMP}/lane-lock-ci-settings.json"

      - name: Smoke test install script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node bin/install.mjs --target "${RUNNER_TEMP}/lane-lock-ci-settings.json"

      - name: Hero drift fixture
        run: node --test tests/e2e/cross-project-drift.test.mjs
