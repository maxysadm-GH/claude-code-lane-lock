name: CI

once: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm install --only=dev

      - run: npm test

      - run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            node bin/install.mjs --target C:\\tmp\\test-settings.json
          else
            node bin/install.mjs --target /tmp/test-settings.json
          fi
        shell: bash
