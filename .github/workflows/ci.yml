name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Debug environment
        run: |
          node --version
          npm --version
          git --version
          echo "os=$RUNNER_OS"
          ls -la tests/unit/ tests/e2e/

      - name: Test paths.mjs
        run: node --test tests/unit/paths.test.mjs

      - name: Test pin.mjs
        run: node --test tests/unit/pin.test.mjs

      - name: Test match.mjs
        run: node --test tests/unit/match.test.mjs

      - name: Test cross-project drift (e2e hero)
        run: node --test tests/e2e/cross-project-drift.test.mjs

      - name: Smoke test install script (POSIX)
        if: runner.os != 'Windows'
        run: node bin/install.mjs --target "${RUNNER_TEMP}/lane-lock-ci-settings.json"

      - name: Smoke test install script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node bin/install.mjs --target "${RUNNER_TEMP}/lane-lock-ci-settings.json"

      - name: Hero drift fixture
        run: node --test tests/e2e/cross-project-drift.test.mjs
