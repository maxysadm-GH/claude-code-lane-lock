<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title>claude-code-lane-lock architecture</title>
  <desc>Seven hooks pin a Claude Code session to its git project root. UserPromptSubmit exit 2 is the hero kill path, shown in red.</desc>

  <defs>
    <!-- Arrow marker (neutral) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <!-- Arrow marker (kill path, red) -->
    <marker id="arrow-kill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <!-- Soft drop shadow for cards -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">claude-code-lane-lock</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">Pin sessions to their git root. Block drift at t=0, before any reasoning token fires.</text>

  <!-- ============================================================ -->
  <!-- Layer 1: Claude Code session                                  -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="1040" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  </g>
  <text x="100" y="128" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">CLAUDE CODE SESSION</text>
  <rect x="100" y="140" width="200" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="200" y="163" text-anchor="middle" font-size="13" fill="#e2e8f0">User prompt</text>
  <text x="322" y="163" font-size="16" fill="#64748b">→</text>
  <rect x="345" y="140" width="250" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="470" y="163" text-anchor="middle" font-size="13" fill="#e2e8f0">Hook dispatcher (harness)</text>
  <text x="612" y="163" font-size="16" fill="#64748b">→</text>
  <rect x="635" y="140" width="250" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="760" y="163" text-anchor="middle" font-size="13" fill="#e2e8f0">Reasoning &amp; tool calls</text>
  <text x="902" y="163" font-size="16" fill="#64748b">→</text>
  <rect x="925" y="140" width="170" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="1010" y="163" text-anchor="middle" font-size="13" fill="#e2e8f0">Response</text>

  <!-- ============================================================ -->
  <!-- Layer 2: The 7 hooks                                          -->
  <!-- ============================================================ -->
  <text x="100" y="228" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">HOOKS (bin/*.mjs)</text>

  <!-- SessionStart -->
  <g filter="url(#shadow)">
    <rect x="80" y="240" width="150" height="78" rx="8" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="155" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">SessionStart</text>
  <text x="155" y="281" text-anchor="middle" font-size="10" fill="#64748b">t = 0</text>
  <text x="155" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">capture git root</text>
  <text x="155" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">write lockfile</text>

  <!-- UserPromptSubmit (KILL POINT - highlighted) -->
  <g filter="url(#shadow)">
    <rect x="245" y="240" width="170" height="78" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="330" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#fecaca">UserPromptSubmit</text>
  <text x="330" y="281" text-anchor="middle" font-size="10" fill="#f87171">before reasoning</text>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#fca5a5">regex scan prompt</text>
  <text x="330" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#fecaca">exit 2 → KILL</text>

  <!-- PreToolUse read-warn -->
  <g filter="url(#shadow)">
    <rect x="430" y="240" width="170" height="78" rx="8" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="515" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">PreToolUse (read)</text>
  <text x="515" y="281" text-anchor="middle" font-size="10" fill="#64748b">Read | Grep | Glob</text>
  <text x="515" y="300" text-anchor="middle" font-size="10" fill="#facc15">allow + warn</text>
  <text x="515" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">cross-lane permitted</text>

  <!-- PreToolUse write-block -->
  <g filter="url(#shadow)">
    <rect x="615" y="240" width="170" height="78" rx="8" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="700" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">PreToolUse (write)</text>
  <text x="700" y="281" text-anchor="middle" font-size="10" fill="#64748b">Edit|Write|Bash</text>
  <text x="700" y="300" text-anchor="middle" font-size="10" fill="#f87171">deny decision</text>
  <text x="700" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">hard block</text>

  <!-- CwdChanged -->
  <g filter="url(#shadow)">
    <rect x="800" y="240" width="130" height="78" rx="8" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="865" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">CwdChanged</text>
  <text x="865" y="281" text-anchor="middle" font-size="10" fill="#64748b">on cd</text>
  <text x="865" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">re-verify pin</text>

  <!-- SessionEnd -->
  <g filter="url(#shadow)">
    <rect x="945" y="240" width="110" height="78" rx="8" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="1000" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">SessionEnd</text>
  <text x="1000" y="281" text-anchor="middle" font-size="10" fill="#64748b">on close</text>
  <text x="1000" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">cleanup lockfile</text>

  <!-- TaskCreated -->
  <g filter="url(#shadow)">
    <rect x="1070" y="240" width="50" height="78" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3,3"/>
  </g>
  <text x="1095" y="270" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">Task</text>
  <text x="1095" y="282" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">Created</text>
  <text x="1095" y="300" text-anchor="middle" font-size="8" fill="#64748b">no-op</text>
  <text x="1095" y="312" text-anchor="middle" font-size="8" fill="#64748b">forward</text>

  <!-- Arrows from session to each hook -->
  <line x1="175" y1="178" x2="155" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="178" x2="330" y2="240" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-kill)"/>
  <line x1="500" y1="178" x2="515" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="178" x2="700" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="178" x2="865" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="178" x2="1000" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="178" x2="1095" y2="240" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- stdin label on UserPromptSubmit arrow -->
  <text x="370" y="212" font-size="10" fill="#f87171" font-style="italic">stdin: {prompt}</text>

  <!-- ============================================================ -->
  <!-- Layer 3: lib/ modules                                         -->
  <!-- ============================================================ -->
  <text x="100" y="365" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">SHARED LIBRARY (lib/*.mjs)</text>

  <g filter="url(#shadow)">
    <rect x="80" y="378" width="1040" height="88" rx="10" fill="#1e293b" stroke="#334155"/>
  </g>

  <!-- 7 lib modules as pills -->
  <g>
    <rect x="110" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="170" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">paths.mjs</text>
    <text x="170" y="436" text-anchor="middle" font-size="9" fill="#64748b">XDG + session id</text>
  </g>
  <g>
    <rect x="245" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="305" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">pin.mjs</text>
    <text x="305" y="436" text-anchor="middle" font-size="9" fill="#64748b">read/write lockfile</text>
  </g>
  <g>
    <rect x="380" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="440" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">config.mjs</text>
    <text x="440" y="436" text-anchor="middle" font-size="9" fill="#64748b">load rules + tiers</text>
  </g>
  <g>
    <rect x="515" y="400" width="120" height="44" rx="22" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="575" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#fecaca">match.mjs</text>
    <text x="575" y="436" text-anchor="middle" font-size="9" fill="#fca5a5">regex drift scan</text>
  </g>
  <g>
    <rect x="650" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="710" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">log.mjs</text>
    <text x="710" y="436" text-anchor="middle" font-size="9" fill="#64748b">JSONL audit</text>
  </g>
  <g>
    <rect x="785" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="845" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">exit.mjs</text>
    <text x="845" y="436" text-anchor="middle" font-size="9" fill="#64748b">exit codes + stderr</text>
  </g>
  <g>
    <rect x="920" y="400" width="120" height="44" rx="22" fill="#0f172a" stroke="#475569"/>
    <text x="980" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">stdin.mjs</text>
    <text x="980" y="436" text-anchor="middle" font-size="9" fill="#64748b">JSON from harness</text>
  </g>

  <!-- Arrows from hooks layer down into lib -->
  <line x1="155" y1="318" x2="170" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="330" y1="318" x2="575" y2="400" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-kill)"/>
  <line x1="515" y1="318" x2="305" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="318" x2="440" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="865" y1="318" x2="710" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1000" y1="318" x2="845" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- Layer 4: Session lockfile                                     -->
  <!-- ============================================================ -->
  <text x="100" y="510" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">PERSISTENT STATE</text>

  <g filter="url(#shadow)">
    <rect x="320" y="525" width="560" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="600" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">~/.claude/lane-lock/sessions/&lt;session_id&gt;.json</text>
  <text x="600" y="578" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="'Consolas', 'Courier New', monospace">{ "project_root": "/home/user/projects/project-alpha",</text>
  <text x="600" y="595" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="'Consolas', 'Courier New', monospace">  "git_root": "/home/user/projects/project-alpha",</text>
  <text x="600" y="612" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="'Consolas', 'Courier New', monospace">  "aliases": ["project-alpha"], "pinned_at": "2026-04-08T..." }</text>

  <!-- arrows from lib modules to lockfile -->
  <line x1="170" y1="444" x2="400" y2="525" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="305" y1="444" x2="500" y2="525" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="710" y1="444" x2="720" y2="525" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- Kill path callout                                             -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="80" y="670" width="1040" height="100" rx="10" fill="#0c0a09" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="100" y="698" font-size="12" font-weight="700" fill="#fecaca" letter-spacing="1">THE HERO MECHANISM — UserPromptSubmit exit 2</text>
  <text x="100" y="722" font-size="12" fill="#fca5a5">1. Harness pipes prompt JSON on stdin  →  2. match.mjs scans for sibling project aliases  →  3. hook writes reason to stderr</text>
  <text x="100" y="740" font-size="12" fill="#fca5a5">4. hook returns exit code 2  →  5. harness ERASES the prompt from context before any reasoning token fires  →  0 tokens burned on drift</text>
  <text x="100" y="758" font-size="11" fill="#94a3b8" font-style="italic">Read-tier drift gets an allow+warn. Write-tier drift gets a deny decision. Only UserPromptSubmit can kill a prompt pre-reasoning.</text>

  <!-- Legend -->
  <g transform="translate(900, 680)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#450a0a" stroke="#dc2626"/>
    <text x="20" y="12" font-size="11" fill="#94a3b8">kill path</text>
    <rect x="0" y="22" width="14" height="14" rx="2" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="34" font-size="11" fill="#94a3b8">neutral flow</text>
    <line x1="0" y1="52" x2="14" y2="52" stroke="#64748b" stroke-dasharray="3,3"/>
    <text x="20" y="56" font-size="11" fill="#94a3b8">forward-compat</text>
  </g>
</svg>
