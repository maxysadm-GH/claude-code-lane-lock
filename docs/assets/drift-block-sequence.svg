<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title>claude-code-lane-lock — drift block sequence</title>
  <desc>How UserPromptSubmit exit 2 erases a drift prompt before any reasoning token fires.</desc>

  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="seq-arrow-kill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="seq-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="seq-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Drift block — the hero path</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">Session pinned to <tspan font-family="'Consolas', monospace" fill="#c4b5fd">~/projects/project-alpha/</tspan>. User types a project-beta prompt.</text>

  <!-- Lifelines -->
  <!-- 5 columns: User, Claude Code, UserPromptSubmit hook, lib/match, lockfile -->
  <g font-size="11" fill="#e2e8f0">
    <!-- User -->
    <g filter="url(#seq-shadow)">
      <rect x="50" y="90" width="120" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    </g>
    <text x="110" y="115" text-anchor="middle" font-weight="700">User</text>
    <line x1="110" y1="130" x2="110" y2="680" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- Claude Code -->
    <g filter="url(#seq-shadow)">
      <rect x="220" y="90" width="180" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    </g>
    <text x="310" y="115" text-anchor="middle" font-weight="700">Claude Code harness</text>
    <line x1="310" y1="130" x2="310" y2="680" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- UserPromptSubmit hook -->
    <g filter="url(#seq-shadow)">
      <rect x="450" y="82" width="220" height="56" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
    </g>
    <text x="560" y="105" text-anchor="middle" font-weight="700" fill="#fecaca">UserPromptSubmit hook</text>
    <text x="560" y="122" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="'Consolas', monospace">bin/user-prompt-submit.mjs</text>
    <line x1="560" y1="138" x2="560" y2="680" stroke="#dc2626" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- lib/match -->
    <g filter="url(#seq-shadow)">
      <rect x="720" y="90" width="160" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    </g>
    <text x="800" y="108" text-anchor="middle" font-weight="700">lib/match.mjs</text>
    <text x="800" y="122" text-anchor="middle" font-size="10" fill="#94a3b8">regex drift scan</text>
    <line x1="800" y1="130" x2="800" y2="680" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- lockfile -->
    <g filter="url(#seq-shadow)">
      <rect x="930" y="90" width="220" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    </g>
    <text x="1040" y="108" text-anchor="middle" font-weight="700">session lockfile</text>
    <text x="1040" y="122" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="'Consolas', monospace">sessions/&lt;id&gt;.json</text>
    <line x1="1040" y1="130" x2="1040" y2="680" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Messages -->
  <g font-size="11" fill="#e2e8f0">

    <!-- 1. User → CC: prompt -->
    <line x1="110" y1="170" x2="310" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="210" y="163" text-anchor="middle" fill="#cbd5e1">1. types: "work on project-beta"</text>

    <!-- 2. CC → Hook: stdin -->
    <line x1="310" y1="205" x2="560" y2="205" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="435" y="198" text-anchor="middle" fill="#cbd5e1">2. spawn hook, pipe JSON to stdin</text>
    <text x="435" y="220" text-anchor="middle" font-size="10" fill="#64748b" font-family="'Consolas', monospace">{ prompt, session_id, cwd }</text>

    <!-- 3. Hook → lockfile: read pin -->
    <line x1="560" y1="255" x2="1040" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="800" y="248" text-anchor="middle" fill="#cbd5e1">3. loadPin(session_id) — read lockfile</text>

    <!-- 4. lockfile → Hook: pin data (dashed return) -->
    <line x1="1040" y1="285" x2="560" y2="285" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-return)"/>
    <text x="800" y="278" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="'Consolas', monospace">{ pin: "project-alpha", aliases: ["project-alpha"] }</text>

    <!-- 5. Hook → match: scanPrompt -->
    <line x1="560" y1="320" x2="800" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#seq-arrow-kill)"/>
    <text x="680" y="313" text-anchor="middle" fill="#fca5a5">4. scanPrompt(text, siblingAliases)</text>

    <!-- match self-loop: regex hit -->
    <path d="M 810 340 Q 870 345 870 365 Q 870 385 810 385" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="895" y="362" font-size="10" fill="#fca5a5">regex: /\bproject-beta\b/</text>
    <text x="895" y="376" font-size="10" fill="#fca5a5">→ sibling alias hit</text>

    <!-- 6. match → Hook: block decision -->
    <line x1="800" y1="410" x2="560" y2="410" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-return)"/>
    <text x="680" y="403" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="'Consolas', monospace">{ decision: "block", reason: "alias", token: "project-beta" }</text>

    <!-- 7. Hook → CC: stderr warning -->
    <line x1="560" y1="450" x2="310" y2="450" stroke="#dc2626" stroke-width="2" marker-end="url(#seq-arrow-kill)"/>
    <text x="435" y="443" text-anchor="middle" fill="#fecaca">5. stderr: "lane-lock: drift prompt BLOCKED"</text>

    <!-- 8. Hook → CC: exit 2 -->
    <line x1="560" y1="485" x2="310" y2="485" stroke="#dc2626" stroke-width="2.5" marker-end="url(#seq-arrow-kill)"/>
    <text x="435" y="478" text-anchor="middle" font-weight="700" fill="#fecaca">6. exit 2</text>

    <!-- KILL BOX -->
    <g filter="url(#seq-shadow)">
      <rect x="220" y="515" width="760" height="66" rx="8" fill="#0c0a09" stroke="#dc2626" stroke-width="2"/>
    </g>
    <text x="600" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#fecaca">harness sees exit 2 on UserPromptSubmit</text>
    <text x="600" y="560" text-anchor="middle" font-size="12" fill="#fca5a5">→ the drift prompt is ERASED from context before any reasoning token fires</text>
    <text x="600" y="576" text-anchor="middle" font-size="11" font-style="italic" fill="#94a3b8">0 tokens spent on drift. 0 tool calls. 0 cleanup.</text>

    <!-- 9. CC → User: erased -->
    <line x1="310" y1="610" x2="110" y2="610" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-return)"/>
    <text x="210" y="603" text-anchor="middle" fill="#cbd5e1">7. prompt erased, still pinned to project-alpha</text>

    <!-- Escape hatch note -->
    <g>
      <rect x="50" y="645" width="1100" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    </g>
    <text x="600" y="662" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">
      Escape hatch — prefix with "[cross-lane: project-beta] ..." to opt in. match.mjs sees the tag → allow + stderr warn, never kill.
    </text>
  </g>
</svg>
